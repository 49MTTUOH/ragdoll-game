<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ragdoll Duel - Пинай мяч!</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <canvas id="canvas"></canvas>
  
  <div id="ui-layer">
    <div class="score-board">
      <span style="color: #4cc9f0" id="p1-score">0</span> : <span style="color: #ff4d6d" id="p2-score">0</span>
    </div>
    <div class="timer" id="timer">60</div>
    <div id="goal-text" class="hidden">ГОЛ!</div>

    <div id="start-screen" class="overlay">
      <h1>⚽ RAGDOLL DUEL ⚽</h1>
      <div class="controls">
        <span style="color: #4cc9f0">Игрок 1:</span> W (Прыжок), A (Влево), D (Вправо)<br>
        <span style="color: #ff4d6d">Игрок 2:</span> ↑ (Прыжок), ← (Влево), → (Вправо)
      </div>
      <button class="btn" id="start-btn">НАЧАТЬ (Пробел)</button>
    </div>

    <div id="game-over" class="overlay hidden">
      <h1 id="winner-text">Победа!</h1>
      <button class="btn" id="restart-btn">ИГРАТЬ СНОВА</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
